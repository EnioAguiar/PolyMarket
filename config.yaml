# Polymarket Bot Configuration
# Trading/safety parameters live here. Secrets, endpoints, and credentials come from
# environment variables instead (see .env.example) — the two coexist.

dryRun: true  # true = log decisions only, false = execute real trades. MUST be explicitly
              # flipped to false to trade real money — never commit false as the default.

safety:
  maxPositionSizePct: 0.10    # 10% of bankroll per bet (BANK-01)
  dailyLossLimitPct: 0.05     # 5% daily loss limit (BANK-02)
  drawdownKillSwitchPct: 0.15 # 15% total drawdown triggers kill switch (BANK-03)

polymarket:
  host: "https://clob.polymarket.com"
  gammaHost: "https://gamma-api.polymarket.com"
  chainId: 137  # Polygon mainnet

logging:
  level: "debug"  # debug for verbose logging
  pretty: true    # human-readable in dev

# Railway deployment settings
railway:
  healthCheckPath: "/health"
  selfPingEnabled: true
